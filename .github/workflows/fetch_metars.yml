name: ⛅ METAR Fetch ⛈️

on:
  schedule:
    - cron: "*/4 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metar-fetch-clean-4min
  cancel-in-progress: true

jobs:
  fetch_and_clean:
    name: 📡 Fetch → 🧹 Clean → 📊 Summarize (fast + robust)
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}

    steps:
      - name: 🛎️ Checkout (shallow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: 🕒 Log UTC start
        run: echo "Triggered at: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"

      - name: 🔧 Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: ♻️ Cache R packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/R/pak
            ~/.local/share/R
            ${{ env.R_LIBS_USER }}
          key: r-lib-${{ runner.os }}-${{ hashFiles('**/renv.lock', '**/DESCRIPTION', '**/packages.txt') }}
          restore-keys: |
            r-lib-${{ runner.os }}-

      - name: 📦 Install required packages (pak)
        run: |
          set -euo pipefail
          Rscript -e 'if (!requireNamespace("pak", quietly=TRUE)) install.packages("pak", repos="https://cloud.r-project.org")'
          Rscript -e 'pak::pkg_install(c("here","httr","jsonlite","tibble","dplyr","lubridate","readr","optparse"))'

      - name: 🔍 Preflight (paths & R session)
        run: |
          set -euo pipefail
          echo "Repo root: $(pwd)"
          ls -la
          echo "Scripts present?"
          ls -l Fetch_METARs.R Clean_METARs.R METAR_Summaries.R
          Rscript -e 'sessionInfo()'

      # Run each script separately (avoids source() path issues)
      - name: 🚀 Run Fetch
        run: |
          set -euo pipefail
          Rscript --vanilla Fetch_METARs.R

      - name: 🧹 Run Clean
        run: |
          set -euo pipefail
          Rscript --vanilla Clean_METARs.R

      - name: 📊 Run Summaries
        run: |
          set -euo pipefail
          Rscript --vanilla METAR_Summaries.R

      - name: 📂 List outputs (non-fatal if missing)
        run: |
          du -sh Data || true
          ls -lh Data/METARs || true
          ls -lh Data/Summaries || true

      - name: 💾 Commit and push updated files (safe on empty)
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          git config --global --add safe.directory '*'

          # Only add paths that exist
          ADD_ARGS=()
          [ -d Data/METARs ] && ADD_ARGS+=("Data/METARs")
          [ -d Data/Summaries ] && ADD_ARGS+=("Data/Summaries")

          if [ ${#ADD_ARGS[@]} -gt 0 ]; then
            git add -A "${ADD_ARGS[@]}"
          fi

          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Fetch/Clean/Summarize METARs $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          else
            echo "No changes to commit."
          fi

      # If something fails, capture logs as artifacts to inspect easily
      - name: 📎 Upload R logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: r-logs
          path: |
            ./*.Rout
            ./*.log
            Data/**/*.log
          if-no-files-found: ignore
