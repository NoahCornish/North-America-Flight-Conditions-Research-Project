name: ⛅ METAR Fetch ⛈️

on:
  schedule:
    # Run every 4 minutes
    - cron: "*/4 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metar-fetch-clean-4min
  cancel-in-progress: true

jobs:
  fetch_and_clean:
    name: 📡 Fetch → 🧹 Clean → 📊 Summarize (fast path)
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}

    steps:
      - name: 🛎️ Checkout (shallow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: 🕒 Log UTC start
        run: echo "Triggered at: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"

      # Set up R with prebuilt Linux binaries via RSPM
      - name: 🔧 Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      # Cache R package library + pak cache for blazing fast dependency steps
      - name: ♻️ Cache R packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/R/pak
            ~/.local/share/R
            ${{ env.R_LIBS_USER }}
          key: r-lib-${{ runner.os }}-${{ hashFiles('**/DESCRIPTION', '**/renv.lock', '**/packages.txt') }}
          restore-keys: |
            r-lib-${{ runner.os }}-

      # If you have an renv.lock, uncomment the renv section below and delete the pak section.
      # - name: 📦 Restore renv library
      #   uses: r-lib/actions/setup-renv@v2

      - name: 📦 Install required packages (pak)
        run: |
          Rscript -e 'if (!requireNamespace("pak", quietly=TRUE)) install.packages("pak", repos="https://cloud.r-project.org")'
          Rscript -e 'pak::pkg_install(c("here","httr","jsonlite","tibble","dplyr","lubridate","readr","optparse"))'

      - name: 🔍 Sanity check workspace
        run: |
          echo "GITHUB_WORKSPACE=${GITHUB_WORKSPACE}"
          test -d .git || (echo "::error::.git not found" && exit 1)

      # Run all your scripts in ONE R session to cut startup overhead
      - name: 🚀 Run pipeline (Fetch → Clean → Summarize)
        run: |
          Rscript --vanilla - <<'RSCRIPT'
          message("R version: ", R.version.string)
          source("Fetch_METARs.R")
          source("Clean_METARs.R")
          source("METAR_Summaries.R")
          RSCRIPT

      - name: 📂 List generated outputs
        run: ls -lh Data/METARs Data/Summaries || true

      - name: 💾 Commit and push updated files
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          git config --global --add safe.directory '*'
          git add -A Data/METARs Data/Summaries
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Fetch/Clean/Summarize METARs $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          else
            echo "No changes to commit."
          fi
